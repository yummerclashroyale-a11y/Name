function getDeviceInfo() {
    const ua = navigator.userAgent;
    if (/android/i.test(ua)) {
        const match = ua.match(/Android\s+[\d\.]+;\s*([^;]+)\s*Build/i);
        return match ? `Android (${match[1].trim()})` : "Android устройство";
    }
    if (/iPhone|iPad|iPod/i.test(ua)) return "Apple iOS";
    if (/Windows/i.test(ua)) return "Windows PC";
    if (/Macintosh/i.test(ua)) return "Mac PC";
    return "Неизвестное устройство";
}

function sendToTelegram(score, total, history) {
    const device = getDeviceInfo();
    
    let details = history.map((h, i) => {
        const userStr = h.userChoice === null ? "⏱ Таймаут" : (h.userChoice ? "Виновен" : "Не виновен");
        const correctStr = h.isGuilty ? "Виновен" : "Не виновен";
        const icon = h.isCorrect ? "✅" : "❌";
        return `${i+1}. ${h.desc}\n   Выбор: ${userStr} | Итог: ${correctStr} ${icon}`;
    }).join("\n\n");

    const message = `🎮 <b>Новая попытка в Симуляторе Судьи!</b>\n\n` +
                    `👤 Никнейм: <b>${playerNickname}</b>\n` +
                    `📱 Устройство: <b>${device}</b>\n` +
                    `📊 Результат: <b>${score} из ${total}</b>\n` +
                    `🏆 Статус: ${score >= 7 ? "Победа 🎉" : "Поражение ❌"}\n\n` +
                    `<b>Детали раунда:</b>\n${details}`;

    fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: "HTML"
        })
    }).catch(err => console.error("Ошибка отправки в Telegram:", err));
}

scene("game", () => {
    let timeLeft = 20;
    const currentCase = currentGameCases[idx];

    add([
        text(`Дело ${idx + 1}/10`, { size: 16 }),
        pos(30, 40),
        color(148, 163, 184)
    ]);

    const timerText = add([
        text(`${timeLeft}с`, { size: 18 }),
        pos(370, 40),
        color(248, 113, 113),
        anchor("topright")
    ]);

    add([
        rect(340, 200, { radius: 12 }),
        pos(center().x, 200),
        color(51, 65, 85),
        anchor("center")
    ]);

    add([
        text(currentCase.desc, { size: 15, width: 300 }),
        pos(center().x, 200),
        anchor("center")
    ]);

    function makeChoice(userChoice) {
        const isCorrect = userChoice !== null && userChoice === currentCase.isGuilty;
        if (isCorrect) score++;

        currentHistory.push({
            desc: currentCase.desc,
            isGuilty: currentCase.isGuilty,
            userChoice: userChoice,
            isCorrect: isCorrect
        });

        idx++;
        if (idx < 10) {
            go("game");
        } else {
            sendToTelegram(score, 10, currentHistory);
            go("result");
        }
    }

    const timerLoop = loop(1, () => {
        timeLeft--;
        timerText.text = `${timeLeft}с`;
        if (timeLeft <= 0) {
            timerLoop.cancel();
            makeChoice(null);
        }
    });

    const btnGuilty = add([
        rect(140, 50, { radius: 8 }),
        pos(110, 390),
        color(239, 68, 68),
        anchor("center"),
        area()
    ]);
    btnGuilty.add([text("ВИНОВЕН", { size: 14 }), anchor("center")]);
    btnGuilty.onClick(() => {
        timerLoop.cancel();
        makeChoice(true);
    });

    const btnInnocent = add([
        rect(140, 50, { radius: 8 }),
        pos(290, 390),
        color(34, 197, 94),
        anchor("center"),
        area()
    ]);
    btnInnocent.add([text("НЕ ВИНОВЕН", { size: 12 }), anchor("center")]);
    btnInnocent.onClick(() => {
        timerLoop.cancel();
        makeChoice(false);
    });
});

scene("result", () => {
