<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дело #1: Проникновение в Синдикат</title>
    <script src="https://cdn.jsdelivr.net/npm/excalibur@0.29.3/build/dist/excalibur.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #050b14; font-family: sans-serif; }
        #game-canvas { width: 100%; height: 100%; display: block; }

        .joystick-base {
            position: absolute; bottom: 25px; width: 85px; height: 85px;
            background: rgba(15, 23, 42, 0.6); border: 2px solid rgba(56, 189, 248, 0.35);
            border-radius: 50%; z-index: 100; touch-action: none;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        #left-joystick-base { left: 25px; }
        #right-joystick-base { right: 25px; border-color: rgba(244, 63, 94, 0.35); position: absolute; }

        .joystick-stick { width: 34px; height: 34px; background: rgba(56, 189, 248, 0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        #right-joystick-stick { background: rgba(244, 63, 94, 0.8); box-shadow: 0 0 10px rgba(244, 63, 94, 0.5); z-index: 2; }

        #ui-overlay { position: absolute; top: 10px; left: 10px; z-index: 200; pointer-events: none; }
        .scan-info { background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; color: #38bdf8; padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: 320px; backdrop-filter: blur(4px); }

        /* Экран заставки */
        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #050b14; z-index: 999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; text-align: center;
            transition: opacity 1s ease;
        }
        #intro-screen h1 { font-size: 28px; color: #38bdf8; margin: 0 0 10px 0; text-shadow: 0 0 15px rgba(56,189,248,0.5); }
        #intro-screen p { font-size: 18px; color: #94a3b8; margin: 0; letter-spacing: 1px; }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.95); z-index: 300; display: flex;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px;
            padding: 22px; max-width: 420px; width: 100%; color: #fff; text-align: center;
        }
        .btn {
            background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 6px;
            font-weight: bold; cursor: pointer; margin-top: 12px; width: 100%; font-size: 14px;
        }
        .btn-danger { background: #be123c; }

        .pass-input {
            width: 90%; padding: 12px; margin: 15px auto; font-size: 20px; text-align: center;
            background: #1e293b; border: 2px solid #38bdf8; color: #38bdf8; border-radius: 8px;
            text-transform: uppercase; letter-spacing: 2px; outline: none; display: block;
        }
    </style>
</head>
<body>

<div id="intro-screen">
    <h1>Made by Yummer</h1>
    <p>Сделано Нурали</p>
</div>

<canvas id="game-canvas"></canvas>

<div id="left-joystick-base" class="joystick-base"><div id="left-joystick-stick" class="joystick-stick"></div></div>
<div id="right-joystick-base" class="joystick-base">
    <div id="right-joystick-stick" class="joystick-stick"></div>
</div>

<div id="ui-overlay">
    <div id="scan-info" class="scan-info"><b>Детективный сканер:</b> Ищите улики правым джойстиком.</div>
</div>

<div id="dialogue-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <h2 style="color: #f43f5e;">Охранник Синдиката</h2>
        <p>«Стой! Назови секретный пароль для входа в банду!»</p>
        <input type="text" id="password-field" class="pass-input" placeholder="ВВЕДИТЕ ПАРОЛЬ..." autocomplete="off">
        <button class="btn" onclick="submitPassword()">Ответить охраннику</button>
    </div>
</div>

<div id="result-modal" class="modal" style="display:none;">
    <div class="modal-content" id="result-content"></div>
</div>

<script>
// Авто-скрытие заставки через 2.5 секунды
setTimeout(() => {
    const intro = document.getElementById('intro-screen');
    intro.style.opacity = '0';
    setTimeout(() => intro.remove(), 1000);
}, 2500);

let moveVector = ex.vec(0, 0);
let scanVector = ex.vec(1, 0);
let isScanningActive = false;

let scanCooldown = false;
let cooldownTimer = 0;
const COOLDOWN_MAX = 2.0;

const game = new ex.Engine({
    canvasElementId: 'game-canvas',
    displayMode: ex.DisplayMode.FillScreen,
    backgroundColor: ex.Color.fromHex('#050b14')
});

const MAP_SIZE = 1000;
const bgImage = new ex.ImageSource('b.png');
const guardImage = new ex.ImageSource('bad.png');
const lanternCommonImage = new ex.ImageSource('ff.png');
const lanternPurpleImage = new ex.ImageSource('fff.png');

const hSources = [];
const aSources = [];
const rSources = [];

for (let i = 1; i <= 8; i++) {
    hSources.push(new ex.ImageSource(`h${i}.png`));
    aSources.push(new ex.ImageSource(`a${i}.png`));
    rSources.push(new ex.ImageSource(`r${i}.png`));
}

const loader = new ex.Loader([
    bgImage, 
    guardImage, 
    lanternCommonImage, 
    lanternPurpleImage, 
    ...hSources, 
    ...aSources, 
    ...rSources
]);
loader.suppressPlayButton = true;

let player, scanTargets = [], npcActor;
let scanConeActor;

function setupJoystick(baseId, stickId, onMove, onRelease) {
    const base = document.getElementById(baseId);
    const stick = document.getElementById(stickId);
    const RADIUS = 28;
    let touchId = null;

    function handle(cx, cy) {
        const rect = base.getBoundingClientRect();
        const dx = cx - (rect.left + rect.width / 2);
        const dy = cy - (rect.top + rect.height / 2);
        const dist = Math.hypot(dx, dy);
        if (dist < 2) { stick.style.transform = `translate(0,0)`; onMove(ex.vec(0,0)); return; }
        const angle = Math.atan2(dy, dx);
        const clamp = Math.min(dist, RADIUS);
        const sx = Math.cos(angle) * clamp, sy = Math.sin(angle) * clamp;
        stick.style.transform = `translate(${sx}px, ${sy}px)`;
        onMove(ex.vec(sx / RADIUS, sy / RADIUS));
    }

    base.addEventListener("touchstart", (e) => { e.preventDefault(); touchId = e.changedTouches[0].identifier; handle(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, {passive:false});
    window.addEventListener("touchmove", (e) => {
        if (touchId === null) return;
        for (let t of e.changedTouches) if (t.identifier === touchId) handle(t.clientX, t.clientY);
    }, {passive:true});
    window.addEventListener("touchend", () => { touchId = null; stick.style.transform = `translate(0,0)`; if (onRelease) onRelease(); });
}

setupJoystick("left-joystick-base", "left-joystick-stick", v => moveVector = v, () => moveVector = ex.vec(0,0));

setupJoystick("right-joystick-base", "right-joystick-stick", 
    v => { 
        if (scanCooldown) return;
        if (v.size > 0.1) { 
            scanVector = v.normalize(); 
            isScanningActive = true; 
        } 
    },
    () => { 
        if (scanCooldown) return;
        if (isScanningActive) { 
            checkScan(); 
            isScanningActive = false; 
        } 
    }
);

function createScanCanvas() {
    const R = 150;
    const canvas = new ex.Canvas({
        width: R * 2, height: R * 2,
        draw: (ctx) => {
            ctx.clearRect(0, 0, R * 2, R * 2);
            ctx.beginPath();
            ctx.moveTo(R, R);
            ctx.arc(R, R, R, -35 * Math.PI / 180, 35 * Math.PI / 180);
            ctx.closePath();

            const grad = ctx.createRadialGradient(R, R, 0, R, R, R);
            grad.addColorStop(0, 'rgba(56, 189, 248, 0.7)');
            grad.addColorStop(1, 'rgba(56, 189, 248, 0.05)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    });
    canvas.origin = ex.vec(0, R);
    return canvas;
}

game.start(loader).then(() => {
    const bgSprite = bgImage.toSprite();
    bgSprite.scale = ex.vec(0.35, 0.35);
    const tileW = 64, tileH = 64;
    
    for (let x = -MAP_SIZE / 2; x < MAP_SIZE / 2; x += tileW) {
        for (let y = -MAP_SIZE / 2; y < MAP_SIZE / 2; y += tileH) {
            const tile = new ex.Actor({ pos: ex.vec(x + tileW / 2, y + tileH / 2), width: tileW, height: tileH, z: 0 });
            tile.graphics.use(bgSprite); 
            game.add(tile);
        }
    }

    const WALL_THICKNESS = 50;
    const HALF_MAP = MAP_SIZE / 2 - 40;
    
    const boundaries = [
        new ex.Actor({ pos: ex.vec(0, -HALF_MAP), width: MAP_SIZE, height: WALL_THICKNESS, collisionType: ex.CollisionType.Fixed }),
        new ex.Actor({ pos: ex.vec(0, HALF_MAP), width: MAP_SIZE, height: WALL_THICKNESS, collisionType: ex.CollisionType.Fixed }),
        new ex.Actor({ pos: ex.vec(-HALF_MAP, 0), width: WALL_THICKNESS, height: MAP_SIZE, collisionType: ex.CollisionType.Fixed }),
        new ex.Actor({ pos: ex.vec(HALF_MAP, 0), width: WALL_THICKNESS, height: MAP_SIZE, collisionType: ex.CollisionType.Fixed })
    ];
    boundaries.forEach(wall => game.add(wall));

    const LANTERN_SCALE = 0.18;
    const commonSprite = lanternCommonImage.toSprite();
    commonSprite.scale = ex.vec(LANTERN_SCALE, LANTERN_SCALE);
    const purpleSprite = lanternPurpleImage.toSprite();
    purpleSprite.scale = ex.vec(LANTERN_SCALE, LANTERN_SCALE);

    // Установлены требуемые тексты: обычный фонарь и обманчивый фиолетовый
    scanTargets = [
        { id: 'l1', pos: ex.vec(180, -120), img: commonSprite, text: "Самый обычный фонарь...." },
        { id: 'l2', pos: ex.vec(-180, -120), img: commonSprite, text: "Самый обычный фонарь...." },
        { id: 'l3', pos: ex.vec(0, -180), img: commonSprite, text: "Самый обычный фонарь...." },
        { id: 'l4', pos: ex.vec(200, 80), img: commonSprite, text: "Самый обычный фонарь...." },
        { id: 'l5', pos: ex.vec(-200, 80), img: commonSprite, text: "Самый обычный фонарь...." },
        { id: 'l_purple', pos: ex.vec(-160, -20), img: purpleSprite, text: "Пасфорд бермах - пароли бывают самыц большой страной" }
    ];

    scanTargets.forEach(t => {
        const actor = new ex.Actor({ 
            pos: t.pos, 
            width: lanternCommonImage.width * LANTERN_SCALE, 
            height: lanternCommonImage.height * LANTERN_SCALE, 
            z: 5 
        });
        actor.graphics.use(t.img);
        game.add(actor);
    });

    const GUARD_SCALE = 0.15;
    const guardSprite = guardImage.toSprite();
    guardSprite.scale = ex.vec(GUARD_SCALE, GUARD_SCALE);

    npcActor = new ex.Actor({ 
        pos: ex.vec(0, 180), 
        width: guardImage.width * GUARD_SCALE, 
        height: guardImage.height * GUARD_SCALE, 
        z: 12,
        collisionType: ex.CollisionType.Fixed
    });
    npcActor.graphics.use(guardSprite);
    game.add(npcActor);

    const PLAYER_SCALE = 0.12;
    const animDown = new ex.Animation({ frames: hSources.map(s => ({ graphic: s.toSprite(), duration: 110 })) });
    const animUp = new ex.Animation({ frames: aSources.map(s => ({ graphic: s.toSprite(), duration: 110 })) });
    const animLeft = new ex.Animation({ frames: rSources.map(s => ({ graphic: s.toSprite(), duration: 110 })) });
    const animRight = new ex.Animation({ frames: rSources.map(s => { const spr = s.toSprite(); spr.flipHorizontal = true; return { graphic: spr, duration: 110 }; }) });

    animDown.play(); animUp.play(); animLeft.play(); animRight.play();

    const idleDown = hSources[0].toSprite();
    const idleUp = aSources[0].toSprite();
    const idleLeft = rSources[0].toSprite();
    const idleRight = rSources[0].toSprite();
    idleRight.flipHorizontal = true;

    player = new ex.Actor({
        pos: ex.vec(0, -60),
        width: hSources[0].width * PLAYER_SCALE * 0.6,
        height: hSources[0].height * PLAYER_SCALE * 0.6,
        z: 30,
        collisionType: ex.CollisionType.Active
    });

    [animDown, animUp, animLeft, animRight].forEach(anim => anim.scale = ex.vec(PLAYER_SCALE, PLAYER_SCALE));
    [idleDown, idleUp, idleLeft, idleRight].forEach(sprite => sprite.scale = ex.vec(PLAYER_SCALE, PLAYER_SCALE));

    player.graphics.add('walk-down', animDown);
    player.graphics.add('walk-up', animUp);
    player.graphics.add('walk-left', animLeft);
    player.graphics.add('walk-right', animRight);
    player.graphics.add('idle-down', idleDown);
    player.graphics.add('idle-up', idleUp);
    player.graphics.add('idle-left', idleLeft);
    player.graphics.add('idle-right', idleRight);

    let currentDir = 'down';
    player.graphics.use('idle-down');
    game.add(player);

    scanConeActor = new ex.Actor({ pos: player.pos, z: 25 });
    scanConeActor.graphics.use(createScanCanvas());
    game.add(scanConeActor);

    game.currentScene.camera.zoom = 2.5;
    game.currentScene.camera.strategy.elasticToActor(player, 0.2, 0.1);

    game.on('update', (engine) => {
        const deltaSec = engine.clock.elapsedMs / 1000;

        if (scanCooldown) {
            cooldownTimer -= deltaSec;
            const rBase = document.getElementById('right-joystick-base');
            const percent = Math.max(0, (cooldownTimer / COOLDOWN_MAX) * 100);
            
            rBase.style.background = `conic-gradient(rgba(244, 63, 94, 0.2) ${percent}%, rgba(15, 23, 42, 0.7) ${percent}%)`;

            if (cooldownTimer <= 0) {
                scanCooldown = false;
                rBase.style.background = 'rgba(15, 23, 42, 0.6)';
            }
        }
    });

    player.on('preupdate', () => {
        if (moveVector.size > 0.1) {
            player.vel = moveVector.scale(80);
            if (Math.abs(moveVector.x) > Math.abs(moveVector.y)) {
                if (moveVector.x > 0) { currentDir = 'right'; player.graphics.use('walk-right'); } 
                else { currentDir = 'left'; player.graphics.use('walk-left'); }
            } else {
                if (moveVector.y > 0) { currentDir = 'down'; player.graphics.use('walk-down'); } 
                else { currentDir = 'up'; player.graphics.use('walk-up'); }
            }
        } else {
            player.vel = ex.vec(0, 0);
            player.graphics.use(`idle-${currentDir}`);
        }

        scanConeActor.pos = player.pos;
        scanConeActor.rotation = scanVector.toAngle();
        scanConeActor.graphics.current.opacity = (isScanningActive && !scanCooldown) ? 1.0 : 0.25;

        if (player.pos.distance(npcActor.pos) < 40) {
            openGuardDialogue();
        }
    });
});

function checkScan() {
    if (scanCooldown) return;

    scanCooldown = true;
    cooldownTimer = COOLDOWN_MAX;
    isScanningActive = false;

    let found = false;
    const info = document.getElementById('scan-info');
    
    for (let t of scanTargets) {
        const dist = player.pos.distance(t.pos);
        if (dist < 140) {
            const dirToTarget = t.pos.sub(player.pos).normalize();
            const dot = scanVector.dot(dirToTarget);
            
            if (dot > 0.5) {
                info.innerHTML = t.text;
                found = true;
                break;
            }
        }
    }
    if (!found) info.innerHTML = "Сканер: Цель не попала в луч.";
}

let isDialogueOpen = false;

function openGuardDialogue() {
    if (isDialogueOpen) return;
    isDialogueOpen = true;
    player.vel = ex.vec(0,0);
    moveVector = ex.vec(0,0);
    document.getElementById('dialogue-modal').style.display = 'flex';
    document.getElementById('password-field').value = '';
    document.getElementById('password-field').focus();
}

function submitPassword() {
    const rawInput = document.getElementById('password-field').value.trim();
    const input = rawInput.toUpperCase().replace(/\s+/g, '');
    document.getElementById('dialogue-modal').style.display = 'none';

    const resModal = document.getElementById('result-modal');
    const resContent = document.getElementById('result-content');

    if (input === "ФИОЛЕТОВЫЙБЕРМАХ") {
        resContent.innerHTML = `
            <h2 style="color: #22c55e;">ДЕЛО #1 ЗАВЕРШЕНО!</h2>
            <p><b>ОТЛИЧНАЯ РАБОТА, ДЕТЕКТИВ!</b><br><br> Вы разгадали хитрость и назвали правильный пароль: <b>ФИОЛЕТОВЫЙ БЕРМАХ</b>.<br><br>Охранник пропустил вас в Синдикат!</p>
            <button class="btn" style="background: #22c55e;" onclick="location.reload()">Пройти заново</button>
        `;
    } else {
        resContent.innerHTML = `
            <h2 style="color: #f43f5e;">ОПЕРАЦИЯ ПРОВАЛЕНА!</h2>
            <p>Пароль <i>«${rawInput}»</i> неверный! Охрана подняла тревогу.</p>
            <button class="btn btn-danger" onclick="location.reload()">Попробовать снова</button>
        `;
    }

    resModal.style.display = 'flex';
}
</script>
</body>
</html>
